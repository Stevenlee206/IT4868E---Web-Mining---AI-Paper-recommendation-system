[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperrec"
version = "0.1.0"
description = "Reproducible scientific paper recommendation experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "psutil>=5.9,<8", "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
graph = ["gensim>=4.4,<5"]
neural = ["torch>=2.2,<3", "transformers>=4.40,<5", "adapters>=1,<2"]

[tool.setuptools.packages.find]
include = ["paperrec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
